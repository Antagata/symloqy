name: tests

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scheduler rules (voice-srs/reference)
        run: python -m unittest discover -s voice-srs/reference/tests -v
      - name: KindleSRS units
        working-directory: experiments/kindle-srs
        run: |
          pip install pillow requests
          python -m unittest discover -s tests -v

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the MCP server
        run: deno check sentence-vault/supabase/functions/mcp-sentence-vault/index.ts
